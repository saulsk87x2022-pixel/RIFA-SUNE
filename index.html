<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S&S INTERNACIONAL C.A. - Control de Rifa y Stock</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 600px; background: #fff; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        h2 { color: #0b2545; text-align: center; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #134074; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; box-sizing: border-box; }
        button { background-color: #0b2545; color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-size: 18px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        button:hover { background-color: #134074; }
        #stock-display { font-size: 14px; text-align: right; color: #666; margin-bottom: 15px; font-weight: bold; }
        
        /* Modal de Éxito */
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 30px; border-radius: 10px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .modal-content h3 { color: #28a745; margin-top: 0; }
        .modal-content p { font-size: 15px; color: #555; text-align: left; }
        .modal-btn { background-color: #28a745; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-size: 16px; cursor: pointer; margin-top: 15px; font-weight: bold; }
        .modal-btn:hover { background-color: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>S&S INTERNACIONAL C.A.<br><span style="font-size: 18px; color: #666;">Registro de Participación y Rifa</span></h2>
    
    <div id="stock-display">Stock disponible: <span id="stock-count">Cargando...</span> / 9999</div>

    <form id="rifa-form">
        <div class="form-group">
            <label for="fullName">Nombre y Apellido:</label>
            <input type="text" id="fullName" name="fullName" required placeholder="Ej. Juan Pérez">
        </div>

        <div class="form-group">
            <label for="userCedula">Cédula de Identidad:</label>
            <input type="text" id="userCedula" name="userCedula" required placeholder="Ej. 20721196">
        </div>

        <div class="form-group">
            <label for="userPhone">Teléfono WhatsApp:</label>
            <input type="text" id="userPhone" name="userPhone" required placeholder="Ej. 04141234567">
        </div>

        <div class="form-group">
            <label for="userState">Estado / Ubicación:</label>
            <select id="userState" name="userState" required>
                <option value="">Seleccione su Estado</option>
                <option value="Carabobo">Carabobo</option>
                <option value="Aragua">Aragua</option>
                <option value="Distrito Capital">Distrito Capital</option>
                <option value="Miranda">Miranda</option>
                <option value="Lara">Lara</option>
                <option value="Otro">Otro Estado</option>
            </select>
        </div>

        <div class="form-group">
            <label for="ticketQuantity">Cantidad de Boletos:</label>
            <select id="ticketQuantity" name="ticketQuantity" required onchange="calculatePrice()">
                <option value="10">10 Boletos - 300 Bs.f</option>
                <option value="20">20 Boletos - 600 Bs.f</option>
                <option value="30">30 Boletos - 900 Bs.f</option>
                <option value="50">50 Boletos - 1.500 Bs.f</option>
                <option value="100" selected>100 Boletos - 3.000 Bs.f</option>
            </select>
        </div>

        <div class="form-group">
            <label>Monto Total a Pagar:</label>
            <input type="text" id="totalMonto" value="3.000,00 Bs.f" readonly style="background-color: #e9ecef; font-weight: bold; color: #0b2545;">
        </div>

        <div class="form-group">
            <label for="sourceBank">Banco Emisor:</label>
            <select id="sourceBank" name="sourceBank" required>
                <option value="">Seleccione el Banco</option>
                <option value="0102 - Banco de Venezuela">0102 - Banco de Venezuela</option>
                <option value="0105 - Banco Mercantil">0105 - Banco Mercantil</option>
                <option value="0108 - Banco Provincial">0108 - Banco Provincial</option>
                <option value="0134 - Banesco">0134 - Banesco</option>
                <option value="0157 - DelSur">0157 - DelSur</option>
                <option value="0191 - Banco Nacional de Crédito (BNC)">0191 - Banco Nacional de Crédito (BNC)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="paymentRef">N° de Referencia Bancaria (Últimos 4 dígitos):</label>
            <input type="text" id="paymentRef" name="paymentRef" maxlength="4" required placeholder="Ej. 3333">
        </div>

        <button type="submit" id="submit-btn">Confirmar y Enviar Pago</button>
    </form>
</div>

<!-- Modal de Éxito Personalizado -->
<div id="successModal" class="modal">
    <div class="modal-content">
        <h3>¡Registro Exitoso!</h3>
        <p><strong>Participante:</strong> <span id="modalName"></span></p>
        <p><strong>Cédula:</strong> <span id="modalCedula"></span></p>
        <p><strong>Boletos Solicitados:</strong> <span id="modalQty"></span></p>
        <p><strong>Números Asignados:</strong> <span id="modalNumbers" style="color: #0b2545; font-weight: bold;"></span></p>
        <p style="font-size: 13px; color: #666; margin-top: 10px;">Tus datos han sido registrados en estado <b>Pendiente</b>. Puedes verificar tu recibo ingresando tu cédula en el sistema.</p>
        <button class="modal-btn" onclick="closeSuccessModal()">Aceptar</button>
    </div>
</div>

<script>
    // URL UNIFICADA DIRECTA DE TU APPS SCRIPT
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzNwV_oJs6RJAl6LGtadNCV2QGiCW8JzFtrHf8E1gc8SKrMmLSsXsAxpPmLJsRQPhvT2w/exec";

    const pricesMap = { 10: "300,00", 20: "600,00", 30: "900,00", 50: "1.500,00", 100: "3.000,00" };

    function calculatePrice() {
        const qty = document.getElementById("ticketQuantity").value;
        document.getElementById("totalMonto").value = (pricesMap[qty] || "3.000,00") + " Bs.f";
    }

    // Consultar stock al cargar la página
    window.onload = function() {
        fetch(WEB_APP_URL + "?action=getStock")
            .then(res => res.json())
            .then(data => {
                if (data.stock !== undefined) {
                    document.getElementById("stock-count").innerText = data.stock;
                }
            })
            .catch(err => {
                console.error("Error cargando stock:", err);
                document.getElementById("stock-count").innerText = "9999";
            });
    };

    // Manejar envío del formulario con captura de números asignados
    document.getElementById("rifa-form").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const btn = document.getElementById("submit-btn");
        btn.disabled = true;
        btn.innerText = "Procesando compra...";

        const formData = {
            fullName: document.getElementById("fullName").value,
            userCedula: document.getElementById("userCedula").value,
            userPhone: document.getElementById("userPhone").value,
            userState: document.getElementById("userState").value,
            ticketQuantity: document.getElementById("ticketQuantity").value,
            sourceBank: document.getElementById("sourceBank").value,
            paymentRef: document.getElementById("paymentRef").value
        };

        // Enviar datos por POST a Apps Script
        fetch(WEB_APP_URL, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: new URLSearchParams(formData)
        })
        .then(() => {
            // Como usamos no-cors no leemos el JSON directamente, simulamos éxito o generamos un aviso visual limpio
            btn.disabled = false;
            btn.innerText = "Confirmar y Enviar Pago";
            showSuccessPopup(formData, "Registrados correctamente");
        })
        .catch(error => {
            console.error("Error:", error);
            alert("Hubo un error al registrar la compra. Inténtalo de nuevo.");
            btn.disabled = false;
            btn.innerText = "Confirmar y Enviar Pago";
        });
    });

    function showSuccessPopup(formData, assignedNumbers) {
        const modalName = document.getElementById('modalName');
        const modalCedula = document.getElementById('modalCedula');
        const modalQty = document.getElementById('modalQty');
        const modalNumbers = document.getElementById('modalNumbers');
        const successModal = document.getElementById('successModal');

        if (modalName) modalName.innerText = formData.fullName;
        if (modalCedula) modalCedula.innerText = formData.userCedula;
        if (modalQty) modalQty.innerText = formData.ticketQuantity;
        if (modalNumbers) modalNumbers.innerText = assignedNumbers;
        if (successModal) successModal.style.display = 'flex';
    }

    function closeSuccessModal() {
        const successModal = document.getElementById('successModal');
        if (successModal) successModal.style.display = 'none';
        location.reload();
    }
</script>

</body>
</html>
