<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSINTERNACIONAL - Super Combo Pack de Emprendedores</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    <header class="hero-header">
        <div class="logo-container">
            <img src="logo.png" alt="SSINTERNACIONAL Logo" class="main-logo">
        </div>
        <span class="badge-live">SORTEO OFICIAL ACTIVO</span>
        <h1>SSINTERNACIONAL</h1>
        <p class="subtitle">SUPER COMBO PACK DE EMPRENDEDORES</p>
    </header>

    <main class="container">
        <!-- Flyer de la Rifa -->
        <section class="flyer-card">
            <div class="flyer-frame">
                <img src="flyer-rifa.jpg" alt="Flyer Rifa S&S" class="flyer-img">
            </div>
            <div class="price-tag">
                <span class="promo-label">Promoción Exclusiva</span>
                <span class="price-value">10 Tickets = 300 Bs.f</span>
            </div>
        </section>

        <!-- Panel de Compra y Selección -->
        <section class="purchase-panel">
            <h2>Selecciona tus Boletos</h2>
            <p class="instruction">Elige la cantidad de números que deseas adquirir:</p>

            <div class="form-group">
                <label for="ticketQuantity">Cantidad de Boletos:</label>
                <select id="ticketQuantity" class="pro-select">
                    <option value="10">10 Boletos - 300 Bs.f (1 Oportunidad)</option>
                    <option value="20">20 Boletos - 600 Bs.f (2 Oportunidades)</option>
                    <option value="30">30 Boletos - 900 Bs.f (3 Oportunidades)</option>
                    <option value="50">50 Boletos - 1,500 Bs.f (5 Oportunidades)</option>
                    <option value="100">100 Boletos - 3,000 Bs.f (Super Pack)</option>
                </select>
            </div>

            <div class="total-display">
                <span>Total a Pagar:</span>
                <strong id="totalPrice">300 Bs.f</strong>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Método de Pago:</label>
                <select id="paymentMethod" class="pro-select">
                    <option value="pagomovil">Pago Móvil (BNC / Banco de Venezuela)</option>
                    <option value="binance">Binance Pay (USDT)</option>
                    <option value="zinli">Zinli</option>
                    <option value="paypal">PayPal</option>
                    <option value="transferencia">Transferencia Bancaria Nacional</option>
                </select>
            </div>

            <button id="buyButton" class="btn-pro">Reservar y Participar</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SSINTERNACIONAL C.A. Todos los derechos reservados.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
