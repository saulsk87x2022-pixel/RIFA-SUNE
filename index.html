<div class="form-group">
                <label for="paymentMethod">Método de Pago:</label>
                <select id="paymentMethod" class="pro-select">
                    <option value="pagomovil">Pago Móvil</option>
                    <option value="binance">Binance Pay (USDT)</option>
                    <option value="zinli" disabled>Zinli (Bloqueado temporalmente)</option>
                    <option value="paypal" disabled>PayPal (Bloqueado temporalmente)</option>
                </select>
            </div>

            <!-- Recuadro dinámico con los datos de Pago Móvil visibles -->
            <div id="paymentInfoBox" class="payment-info-box" style="background: #fffbeb; border: 1px solid #f59e0b; padding: 12px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; color: #92400e; line-height: 1.5;">
                <strong>📲 Datos para realizar tu Pago Móvil:</strong><br>
                • <strong>Banco:</strong> Banco Nacional de Crédito (0191)<br>
                • <strong>Teléfono:</strong> 0414-XXXXXXX<br>
                • <strong>Cédula:</strong> V-XXXXXXXX
            </div>

            <div class="form-group" style="margin-top: 14px;">
                <label for="sourceBank">Banco Emisor (Desde donde envías):</label>
                <select id="sourceBank" class="pro-select">
                    <option value="0102">0102 - Banco de Venezuela</option>
                    <option value="0104">0104 - Banco Venezolano de Credito</option>
                    <option value="0105">0105 - Banco Mercantil</option>
                    <option value="0108">0108 - BBVA Provincial</option>
                    <option value="0114">0114 - Bancaribe</option>
                    <option value="0115">0115 - Banco Exterior</option>
                    <option value="0128">0128 - Banco Caroni</option>
                    <option value="0134">0134 - Banesco</option>
                    <option value="0137">0137 - Banco Sofitasa</option>
                    <option value="0138">0138 - Banco Plaza</option>
                    <option value="0151">0151 - Fondo Comun (BFC)</option>
                    <option value="0156">0156 - 100% Banco</option>
                    <option value="0157">0157 - DelSur Banco Universal</option>
                    <option value="0163">0163 - Banco del Tesoro</option>
                    <option value="0166">0166 - Banco Agricola de Venezuela</option>
                    <option value="0168">0168 - Bancrecer</option>
                    <option value="0169">0169 - Banco R4</option>
                    <option value="0171">0171 - Banco Activo</option>
                    <option value="0172">0172 - Bancamiga</option>
                    <option value="0174">0174 - Banplus</option>
                    <option value="0175">0175 - Banco Bicentenario</option>
                    <option value="0177">0177 - BANFANB</option>
                    <option value="0191">0191 - Banco Nacional de Credito (BNC)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentRef">Referencia de Pago (Últimos 4 dígitos):</label>
                <input type="text" id="paymentRef" class="pro-input" placeholder="Ej. 4892" maxlength="4" oninput="this.value = this.value.replace(/[^0-9]/g, '').slice(0, 4);">
            </div>

            <div class="form-group">
                <label for="paymentReceipt">Adjuntar Capture del Comprobante:</label>
                <input type="file" id="paymentReceipt" class="pro-file" accept="image/*">
            </div>
