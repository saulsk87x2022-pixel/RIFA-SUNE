<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSINTERNACIONAL - Super Combo Pack de Emprendedores</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <div class="glow-bg"></div>
    <header class="hero-header">
        <div class="logo-container">
            <img src="logo.png" alt="SSINTERNACIONAL Logo" class="main-logo">
        </div>
        <span class="badge-live">SORTEO OFICIAL ACTIVO</span>
        <h1>SSINTERNACIONAL</h1>
        <p class="subtitle">SUPER COMBO PACK DE EMPRENDEDORES</p>
    </header>

    <main class="container">
        <!-- Flyer de la Rifa -->
        <section class="flyer-card">
            <div class="flyer-frame">
                <img src="flyer-rifa.jpg" alt="Flyer Rifa S&S" class="flyer-img">
            </div>
            <div class="price-tag">
                <span class="promo-label">Promoción Exclusiva</span>
                <span class="price-value">10 Tickets = 300 Bs.f</span>
            </div>
        </section>

        <!-- Panel de Compra y Datos -->
        <section class="purchase-panel">
            <h2>Participa en el Sorteo</h2>
            <p class="instruction">Completa tus datos y registra tu pago:</p>

            <div class="form-group">
                <label for="fullName">Nombre y Apellido:</label>
                <input type="text" id="fullName" class="pro-input" placeholder="Ej. Carlos Rodríguez">
            </div>

            <div class="form-group">
                <label for="userCedula">Cédula de Identidad:</label>
                <input type="text" id="userCedula" class="pro-input" placeholder="Ej. V-25412365">
            </div>

            <div class="form-group">
                <label for="userPhone">Número de Teléfono / WhatsApp:</label>
                <input type="tel" id="userPhone" class="pro-input" placeholder="Ej. 0414-1234567">
            </div>

            <div class="form-group">
                <label for="ticketQuantity">Cantidad de Boletos:</label>
                <select id="ticketQuantity" class="pro-select">
                    <option value="10">10 Boletos - 300 Bs.f (1 Oportunidad)</option>
                    <option value="20">20 Boletos - 600 Bs.f (2 Oportunidades)</option>
                    <option value="30">30 Boletos - 900 Bs.f (3 Oportunidades)</option>
                    <option value="50">50 Boletos - 1,500 Bs.f (5 Oportunidades)</option>
                    <option value="100">100 Boletos - 3,000 Bs.f (Super Pack)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentMethod">Método de Pago:</label>
                <select id="paymentMethod" class="pro-select">
                    <option value="pagomovil">Pago Móvil (Banco de Venezuela)</option>
                    <option value="binance">Binance Pay (USDT)</option>
                    <option value="zinli">Zinli</option>
                    <option value="paypal">PayPal</option>
                    <option value="transferencia">Transferencia Bancaria Nacional</option>
                </select>
            </div>

            <!-- Recuadro dinámico para los datos de pago -->
            <div id="paymentInfoBox" class="payment-info-box"></div>

            <div class="form-group" style="margin-top: 14px;">
                <label for="sourceBank">Banco Emisor (Desde donde envías):</label>
                <select id="sourceBank" class="pro-select">
                    <option value="bcv">Banco de Venezuela (0102)</option>
                    <option value="bnc">Banco Nacional de Crédito - BNC (0191)</option>
                    <option value="banesco">Banesco (0134)</option>
                    <option value="mercantil">Mercantil (0105)</option>
                    <option value="provincial">BBVA Provincial (0108)</option>
                    <option value="other">Otro Banco / Billetera Digital</option>
                </select>
            </div>

            <div class="form-group">
                <label for="paymentRef">Referencia de Pago (Últimos 4 dígitos o Ref):</label>
                <input type="text" id="paymentRef" class="pro-input" placeholder="Ej. 4892">
            </div>

            <div class="form-group">
                <label for="paymentReceipt">Adjuntar Capture del Comprobante:</label>
                <input type="file" id="paymentReceipt" class="pro-file" accept="image/*">
            </div>

            <div class="total-display">
                <span>Total a Pagar:</span>
                <strong id="totalPrice">300 Bs.f</strong>
            </div>

            <button id="buyButton" class="btn-pro">Confirmar y Enviar Pago</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 SSINTERNACIONAL C.A. Todos los derechos reservados.</p>
    </footer>

    <script src="app.js"></script>
</body>
</html>
